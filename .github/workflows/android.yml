name: Android build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: |
          SDK_ROOT="$ANDROID_HOME"
          if [ -z "$SDK_ROOT" ]; then SDK_ROOT=/usr/local/lib/android/sdk; fi
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run tests and compile both build types
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
      - name: Configure persistent signing
        if: github.event_name != 'pull_request'
        env:
          SIGN_B64: ${{ secrets.JIANKANG_SIGNING_KEYSTORE_B64 }}
          SIGN_STORE_PASSWORD: ${{ secrets.JIANKANG_SIGNING_STORE_PASSWORD }}
          SIGN_KEY_PASSWORD: ${{ secrets.JIANKANG_SIGNING_KEY_PASSWORD }}
          SIGN_ALIAS: ${{ secrets.JIANKANG_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGN_B64" && -z "$SIGN_STORE_PASSWORD" && -z "$SIGN_KEY_PASSWORD" && -z "$SIGN_ALIAS" ]]; then
            echo "::notice::No release signing secrets configured. Debug APK is for CI only."
            exit 0
          fi
          if [[ -z "$SIGN_B64" || -z "$SIGN_STORE_PASSWORD" || -z "$SIGN_KEY_PASSWORD" || -z "$SIGN_ALIAS" ]]; then
            echo "::error::All four stable signing secrets are required."
            exit 1
          fi
          umask 077
          KEYSTORE="$RUNNER_TEMP/jiankang-stable-release.jks"
          printf '%s' "$SIGN_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          echo "JIANKANG_SIGNING_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "JIANKANG_SIGNING_STORE_PASSWORD=$SIGN_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "JIANKANG_SIGNING_KEY_PASSWORD=$SIGN_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "JIANKANG_SIGNING_KEY_ALIAS=$SIGN_ALIAS" >> "$GITHUB_ENV"
      - name: Build signed release and check pinned certificate
        if: env.JIANKANG_SIGNING_STORE_FILE != ''
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --rerun-tasks --no-daemon
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          test -n "$APKSIGNER" && test -s "$APK"
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          EXPECTED=$(tr -d '[:space:]' < ci/stable-signing-certificate.sha256)
          if [[ -z "$ACTUAL" || "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::Release signing certificate changed; do not ship mismatched APK."
            exit 1
          fi
          echo "Stable release certificate verified: $ACTUAL"
      - name: Collect unsigned APK and official signing tool for private offline signing
        if: github.event_name != 'pull_request' && env.JIANKANG_SIGNING_STORE_FILE == ''
        run: |
          set -euo pipefail
          mkdir -p build/private-signing-input
          cp app/build/outputs/apk/release/app-release-unsigned.apk build/private-signing-input/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" build/private-signing-input/
      - name: Upload unsigned APK (not installable)
        if: github.event_name != 'pull_request' && env.JIANKANG_SIGNING_STORE_FILE == ''
        uses: actions/upload-artifact@v4
        with:
          name: Jiankang-unsigned-for-private-signing-only
          path: build/private-signing-input/*
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Jiankang-debug-TEST-ONLY
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Upload stable signed release APK
        uses: actions/upload-artifact@v4
        if: env.JIANKANG_SIGNING_STORE_FILE != ''
        with:
          name: Jiankang-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
